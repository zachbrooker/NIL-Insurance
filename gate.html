<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Preview / World NIL Insurance</title>
<meta name="description" content="Private preview access to World Insurance Associates' NIL & Athletics practice site.">
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="world-logo.png">

<style>
  body {
    min-height: 100vh;
    margin: 0;
    background: var(--navy-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }

  /* Subtle dot grid background */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  .splash {
    position: relative;
    z-index: 1;
    max-width: 440px;
    width: 100%;
    text-align: center;
  }

  .splash-logo {
    margin-bottom: 2.5rem;
    display: inline-flex;
    align-items: center;
    gap: 0.85rem;
  }
  .splash-logo img {
    height: 36px;
    width: auto;
    filter: brightness(0) invert(1);
  }
  .splash-logo .divider {
    width: 1px;
    height: 20px;
    background: rgba(255,255,255,0.22);
  }
  .splash-logo .sub {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
  }

  .splash-eyebrow {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.25rem;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
  }
  .splash-eyebrow .dot {
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .splash h1 {
    font-size: clamp(1.6rem, 2.8vw, 2.05rem);
    font-weight: 300;
    letter-spacing: -0.025em;
    line-height: 1.2;
    color: white;
    margin: 0 0 1rem;
  }

  .splash p.lead {
    font-size: 0.95rem;
    line-height: 1.65;
    color: rgba(255,255,255,0.65);
    margin: 0 0 2.5rem;
  }

  /* Form */
  .splash-form {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }
  .splash-form input {
    width: 100%;
    padding: 0.95rem 1.15rem;
    font-family: var(--sans);
    font-size: 0.95rem;
    color: white;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 2px;
    outline: none;
    text-align: center;
    letter-spacing: 0.02em;
    transition: all 200ms ease;
    box-sizing: border-box;
  }
  .splash-form input::placeholder { color: rgba(255,255,255,0.35); }
  .splash-form input:focus {
    border-color: var(--accent);
    background: rgba(255,255,255,0.1);
  }
  .splash-form button {
    width: 100%;
    padding: 0.95rem 1.5rem;
    font-family: var(--sans);
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--navy-deep);
    background: var(--accent);
    border: none;
    cursor: pointer;
    transition: all 200ms ease;
    letter-spacing: 0.01em;
  }
  .splash-form button:hover {
    background: white;
  }
  .splash-form button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .splash-error {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: #FCA5A5;
    margin-top: 0.5rem;
    min-height: 1.2em;
    opacity: 0;
    transition: opacity 200ms ease;
  }
  .splash-error.show { opacity: 1; }

  .splash-tag {
    margin-top: 2.5rem;
    font-family: var(--mono);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>

<div class="splash">
  <div class="splash-logo">
    <img src="world-logo.png" alt="World Insurance Associates">
    <span class="divider"></span>
    <span class="sub">NIL &amp; Athletics</span>
  </div>

  <div class="splash-eyebrow">
    <span class="dot"></span>
    <span>Private preview</span>
  </div>

  <h1>Access by invitation only.</h1>

  <p class="lead">This site is a working preview ahead of its formal release. Enter your access code to continue.</p>

  <form class="splash-form" id="gateForm" autocomplete="off">
    <input type="password" id="pwd" name="pwd" placeholder="Access code" required spellcheck="false" autocapitalize="off" autofocus>
    <button type="submit" id="submitBtn">Enter site</button>
    <div class="splash-error" id="gateError">Incorrect access code</div>
  </form>

  <div class="splash-tag">World Insurance Associates</div>
</div>

<script>
  const CORRECT_PASSWORD = 'Injury';
  const STORAGE_KEY = 'nil_preview_unlocked';

  const form = document.getElementById('gateForm');
  const pwdInput = document.getElementById('pwd');
  const errorBox = document.getElementById('gateError');
  const submitBtn = document.getElementById('submitBtn');

  if (sessionStorage.getItem(STORAGE_KEY) === '1') {
    window.location.replace('index.html');
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const entered = pwdInput.value.trim();
    if (entered === CORRECT_PASSWORD) {
      sessionStorage.setItem(STORAGE_KEY, '1');
      submitBtn.textContent = 'Entering...';
      submitBtn.disabled = true;
      setTimeout(() => { window.location.replace('index.html'); }, 250);
    } else {
      errorBox.classList.add('show');
      pwdInput.value = '';
      pwdInput.focus();
    }
  });

  pwdInput.addEventListener('input', function() {
    errorBox.classList.remove('show');
  });
</script>

</body>
</html>
